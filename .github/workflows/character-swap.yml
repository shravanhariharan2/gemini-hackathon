name: Character swap
on:
  pull_request:
    paths: ['character_swap/**', '.github/workflows/character-swap.yml']
  push:
    branches: [main]
    paths: ['character_swap/**', '.github/workflows/character-swap.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r character_swap/requirements.txt
      - run: python -m unittest discover -s character_swap/tests -v
