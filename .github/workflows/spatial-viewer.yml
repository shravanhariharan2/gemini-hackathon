name: Spatial viewer
on:
  pull_request:
    paths: ['viewer/**', '.github/workflows/spatial-viewer.yml']
  push:
    branches: [main]
    paths: ['viewer/**', '.github/workflows/spatial-viewer.yml']
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
